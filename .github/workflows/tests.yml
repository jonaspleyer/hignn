name: HIGNN Tests

on:
  push:
    branches: [ main ]  # Run on push to main branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 3. Make Docker available
    - name: Make Docker available
      uses: docker/setup-buildx-action@v3

    # 4. Pull required Docker images (CPU-only)
    - name: Pull required images
      run: |
        docker pull panlabuwmadison/hignn:cpu || true

    # 5. Compile HIGNN
    - name: Compile HIGNN
      run: |
        python3 python/init.py --rebuild

    # 6. Run tests
    - name: Run tests
      run: |
        pytest -s test/test_engine.py