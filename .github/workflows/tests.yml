name: HIGNN Tests

on:
  push:
    branches: [ main ]  # Run on push to main branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install system dependencies
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mpich  # required for mpirun

    # 4. Install Python dependencies
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install numpy pytest torch

    # 5. Compile HIGNN
    - name: Compile HIGNN
      run: |
        python3 python/init.py --rebuild

    # 6. Make Docker available
    - name: Make Docker available
      uses: docker/setup-buildx-action@v3

    # 7. Pull required Docker images (CPU-only)
    - name: Pull required images
      run: |
        docker pull panlabuwmadison/hignn:cpu || true

    # 8. Run tests
    - name: Run tests
      run: |
        pytest -s python/test_engine.py